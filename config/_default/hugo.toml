baseURL = 'https://carpe-tech.org/'
languageCode = 'en-us'
title = 'CARPE — Columbus Arduino & Raspberry Pi Enthusiasts'
theme = 'blowfish'

enableRobotsTXT = true

# Meetings are future-dated events — include them in the build.
buildFuture = true

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

# iCalendar output for meetings (the "Add to my Calendar" download).
# Enabled per-page via `outputs: [HTML, ICS]` in meeting front matter.
[mediaTypes."text/calendar"]
  suffixes = ["ics"]

[outputFormats.ICS]
  mediaType = "text/calendar"
  isPlainText = true
  rel = "alternate"
