# Blowfish params configuration

colorScheme = "blowfish"
defaultAppearance = "dark"
autoSwitchAppearance = false

logo = "img/logo.png"
# The logo is already a "CARPE" wordmark, so don't repeat the long title as text.
disableTextInHeader = true

# Link-preview image for pages without their own featured image.
defaultSocialImage = "img/logo.png"

keywords = ["Raspberry Pi", "Arduino", "ESP32", "microcontrollers", "Raspberry Pi Pico", "electronics", "maker", "Columbus Ohio"]

# Search engine verification. Search Console is best verified by DNS TXT record
# (a Domain property), which needs nothing here; the HTML-tag method goes below.
# [verification]
#   google = ""
#   bing = ""

enableSearch = true
enableCodeCopy = false

[homepage]
  layout = "custom"
  showRecent = false

[article]
  showDate = false
  showDateUpdated = false
  showAuthor = false
  showBreadcrumbs = true
  showTableOfContents = false
  showHero = false
  showReadingTime = false
  showWordCount = false

[list]
  showCards = true
  cardView = true
  cardViewScreenWidth = false
  groupByYear = false
  showSummary = true

[taxonomy]
  showTermCount = true

[header]
  layout = "fixed-fill-blur"

[footer]
  showCopyright = true
  showThemeAttribution = true

# CARPE community links — replace the "#" placeholders with real URLs.
[links]
  discord = "https://discord.gg/JjqR5dPYem"
  meetup = "https://www.meetup.com/columbus-arduino-raspberry-pi-enthusiasts/"
  github = "https://github.com/carpe-tech"
