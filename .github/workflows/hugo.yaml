name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  # Daily rebuild so a finished meeting rolls into "Past meetings" and the next
  # one is promoted on its own. The layouts decide that from build time, so
  # without this the site stays frozen until the next push.
  # 09:00 UTC = 5:00 AM ET during EDT, 4:00 AM during EST.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.154.5
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/New_York
        # No --baseURL override: we serve from the carpe-tech.org custom domain
        # (see static/CNAME), so the baseURL in config/_default/hugo.toml is
        # authoritative. The starter workflow's
        # --baseURL "${{ steps.pages.outputs.base_url }}/" is meant for project
        # sites at user.github.io/repo, and it reported http:// for our domain —
        # which put http:// canonical tags, sitemap entries, RSS links and ICS
        # URLs on a site that is served over https.
        run: |
          hugo \
            --gc \
            --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
