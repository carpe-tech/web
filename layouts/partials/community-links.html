{{/* Community link buttons. Pass a context map: {"links": site.Params.links, "compact": false} */}}
{{ $l := site.Params.links }}
<div class="flex flex-wrap gap-3">
  <a href="{{ $l.discord }}" class="inline-flex items-center gap-2 rounded-lg community-btn-discord px-4 py-2 text-sm font-medium text-white hover:opacity-90">
    💬 Discord
  </a>
  <a href="{{ $l.meetup }}" class="inline-flex items-center gap-2 rounded-lg community-btn-meetup px-4 py-2 text-sm font-medium text-white hover:opacity-90">
    📅 Meetup
  </a>
  <a href="{{ $l.github }}" class="inline-flex items-center gap-2 rounded-lg community-btn-github px-4 py-2 text-sm font-medium text-white hover:opacity-90">
    🐙 GitHub
  </a>
</div>
